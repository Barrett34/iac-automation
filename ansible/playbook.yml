- name: Configure dev servers
  hosts: all
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy landing page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>{{ tags.Name }}</h1>
          <p>Role: {{ tags.Role }} | Environment: {{ tags.Environment }}</p>
          <p>Configured by Ansible</p>

    - name: Make sure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true